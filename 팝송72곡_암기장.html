<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>팝송 72곡 암기장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: songbook index on the left (72 tracks, grouped by theme), practice sheet on the right; stacks on phones. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --sunk:#E3E8EF; --ink:#16233A; --muted:#5B677A; --line:#D3DAE4;
  --accent:#2448B4; --accent-ink:#FFFFFF; --mark:#FFE36E; --mark-ink:#16233A;
  --ok:#17804F; --ok-bg:#DDF3E7; --bad:#B9312F; --bad-bg:#FBE3E1;
  --f-display:"DM Serif Display", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141F; --surface:#162031; --sunk:#111A28; --ink:#E5EBF4; --muted:#93A0B4; --line:#2A3649;
  --accent:#8EA7FF; --accent-ink:#0E141F; --mark:#5E5214; --mark-ink:#FFF4C2;
  --ok:#57C891; --ok-bg:#163527; --bad:#F27B76; --bad-bg:#3A1C1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141F; --surface:#162031; --sunk:#111A28; --ink:#E5EBF4; --muted:#93A0B4; --line:#2A3649;
  --accent:#8EA7FF; --accent-ink:#0E141F; --mark:#5E5214; --mark-ink:#FFF4C2;
  --ok:#57C891; --ok-bg:#163527; --bad:#F27B76; --bad-bg:#3A1C1C; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4vw,34px);line-height:1.1;margin:0;letter-spacing:.2px}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent}
.btn.small{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}

.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
aside.index{background:var(--surface);border:1px solid var(--line);border-radius:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);display:flex;flex-direction:column;overflow:hidden}
.index-head{padding:14px 14px 10px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.stat-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stat-row b{color:var(--ink)}
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);width:0}
#search{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.list{overflow-y:auto;padding:6px 6px 12px}
.group-label{font-size:11.5px;letter-spacing:.06em;color:var(--muted);padding:12px 8px 4px;font-weight:600}
.song{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:6px;align-items:center;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:6px 8px;cursor:pointer}
.song:hover{background:var(--sunk)}
.song.active{background:var(--accent);color:var(--accent-ink)}
.song .no{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.song.active .no{color:inherit;opacity:.8}
.song .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.chip{font-size:11px;font-family:var(--f-mono);padding:1px 6px;border-radius:10px;border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.has{border-color:transparent;background:var(--sunk);color:var(--ink)}
.chip.done{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.song.active .chip{background:transparent;border-color:currentColor;color:inherit}
.mobile-toggle{display:none}

main.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.sheet-head{padding:20px 22px 0;display:grid;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.song-title{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4.4vw,42px);line-height:1.1;margin:0;text-wrap:balance}
.head-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 18px;margin-top:14px;overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 22px;border-bottom:1px dashed var(--line);font-size:14px}
.toolbar .sep{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
label.check{display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-size:13.5px}
.body{padding:16px 22px 26px}

/* lyric lines */
.lines{display:grid;gap:2px;counter-reset:ln}
.ln{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;padding:7px 6px;border-radius:8px}
.ln:hover{background:var(--sunk)}
.ln .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:3px;text-align:right;font-variant-numeric:tabular-nums}
.ln .en{font-size:17px;line-height:1.5;overflow-wrap:anywhere}
.ln .ko{font-size:13.5px;color:var(--muted);margin-top:2px}
.ln.playing{background:var(--mark);color:var(--mark-ink)}
.ln.playing .ko,.ln.playing .n{color:var(--mark-ink)}
.hidden-en{color:transparent;background:var(--sunk);border-radius:4px;cursor:pointer;user-select:none}
.speak{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:3px 5px;border-radius:6px}
.speak:hover{color:var(--accent);background:var(--sunk)}
.speak svg{width:17px;height:17px;display:block}

.initials .en{font-family:var(--f-mono);font-size:15.5px;letter-spacing:.02em;cursor:pointer}
.initials .en .gap{color:var(--muted)}
.initials .ln.open .en{font-family:var(--f-body);font-size:17px;letter-spacing:0}

.cloze .en{line-height:2.1}
.blank{font-family:var(--f-mono);font-size:15px;border:0;border-bottom:2px solid var(--muted);background:var(--mark);color:var(--mark-ink);border-radius:4px 4px 0 0;padding:1px 4px;margin:0 1px;text-align:center;min-width:2.2ch}
.blank.ok{background:var(--ok-bg);color:var(--ok);border-bottom-color:var(--ok)}
.blank.bad{background:var(--bad-bg);color:var(--bad);border-bottom-color:var(--bad)}
.score{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13.5px}

/* test card */
.card{max-width:720px;margin:6px auto 0;display:grid;gap:14px}
.progress-line{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.cue{padding:12px 14px;border-left:3px solid var(--line);color:var(--muted);font-size:15px}
.cue small{display:block;font-size:11.5px;letter-spacing:.06em;font-weight:600;margin-bottom:2px}
.prompt-ko{font-size:19px;font-weight:600;line-height:1.45}
.prompt-ko.none{font-weight:400;color:var(--muted);font-size:15px}
#t-answer{width:100%;min-height:76px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:17px;resize:vertical}
.reveal{padding:14px;border-radius:10px;background:var(--sunk);font-size:17px;line-height:1.7}
.reveal .w-ok{color:var(--ok);font-weight:600}
.reveal .w-miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
.reveal .acc{display:block;margin-top:6px;font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grade .btn{justify-content:center;padding:11px;font-size:15px}
.btn.know{background:var(--ok-bg);color:var(--ok);border-color:transparent;font-weight:600}
.btn.again{background:var(--bad-bg);color:var(--bad);border-color:transparent;font-weight:600}
.done-box{text-align:center;padding:26px 10px;display:grid;gap:10px;justify-items:center}
.done-box .big{font-family:var(--f-display);font-size:44px;line-height:1}

/* editor + empty */
.editor{display:grid;gap:12px}
.editor textarea{width:100%;min-height:300px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:15px;line-height:1.6;resize:vertical}
.hint{background:var(--sunk);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--muted)}
.hint b{color:var(--ink)}
.hint ol{margin:6px 0 0;padding-left:20px}
.parse-info{font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.note{font-size:12.5px;color:var(--muted);margin-top:4px;padding:4px 10px;border-left:2px solid var(--mark);white-space:pre-line}
.import-box{border:1.5px dashed var(--accent);border-radius:12px;padding:18px;display:grid;gap:8px;justify-items:start;background:var(--sunk)}
.import-box strong{font-size:16px}
.example-tag{display:inline-block;font-size:11.5px;background:var(--mark);color:var(--mark-ink);padding:1px 8px;border-radius:10px;font-weight:600}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;display:grid;gap:10px}
.panel h2{margin:0;font-size:16px}
.panel textarea{width:100%;min-height:110px;font-family:var(--f-mono);font-size:12px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;z-index:20}

/* player */
.playerbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(10,20,40,.10);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pb-in{max-width:1240px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pb-in+.pb-in{margin-top:8px}
.pb-title{font-weight:600;font-size:14px;min-width:0;flex:1 1 140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb-time{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
#pb-seek{flex:4 1 220px;min-width:0;accent-color:var(--accent)}
.btn.on{background:var(--mark);color:var(--mark-ink);border-color:transparent;font-weight:600}
#pb-stamp{padding:10px 18px;font-size:15px}
body.has-player .wrap{padding-bottom:170px}
.ln .n.jump{cursor:pointer;color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px}
.song .aud{font-size:12px;color:var(--accent);margin-left:-2px}
.song.active .aud{color:inherit}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside.index{position:static;max-height:none}
  aside.index .list{display:none;max-height:55vh}
  aside.index.open .list{display:block}
  .mobile-toggle{display:inline-flex}
  .sheet-head,.toolbar,.body{padding-left:14px;padding-right:14px}
  .tabs{padding:0 8px}
  .ln{grid-template-columns:24px minmax(0,1fr) auto;gap:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>팝송 72곡 암기장</h1>
      <p>강의 자료(zip·hwp)를 불러와 가사 보기 · 첫 글자 · 빈칸 · 한 줄씩 테스트로 외웁니다. 자료는 이 브라우저 안에서만 읽고 저장합니다.</p>
    </div>
    <div class="top-actions">
      <label class="btn primary" for="hwp-files">강의 자료 불러오기 (zip · hwp)</label>
      <input type="file" id="hwp-files" accept=".zip,.hwp" multiple hidden>
      <label class="btn" for="audio-files">음악 불러오기</label>
      <input type="file" id="audio-files" accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac,.flac" multiple hidden>
      <input type="file" id="audio-one" accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac,.flac" hidden>
      <button class="btn" id="btn-backup" type="button">백업 · 복원</button>
    </div>
  </header>

  <section class="panel" id="backup-panel" hidden>
    <h2>백업 · 복원</h2>
    <p class="hint" style="margin:0">브라우저 데이터를 지우거나 다른 기기에서 쓰려면 아래 백업 코드를 복사해 메모장 등에 보관하세요. 복원할 때는 코드를 붙여넣거나 저장해 둔 .json 파일을 고르면 됩니다.</p>
    <div class="row">
      <button class="btn" id="btn-export" type="button">백업 코드 만들기</button>
      <button class="btn" id="btn-copy-export" type="button" disabled>복사</button>
    </div>
    <textarea id="backup-text" placeholder="여기에 백업 코드가 나옵니다. 복원하려면 보관해 둔 코드를 여기에 붙여넣으세요." spellcheck="false"></textarea>
    <div class="row">
      <button class="btn primary" id="btn-import" type="button">붙여넣은 코드로 복원</button>
      <label class="btn" for="import-file">.json 파일에서 복원</label>
      <input type="file" id="import-file" accept=".json,.txt,application/json" hidden>
      <span class="parse-info" id="import-msg"></span>
    </div>
  </section>

  <div class="layout">
    <aside class="index" id="index">
      <div class="index-head">
        <div class="row" style="justify-content:space-between">
          <strong style="font-size:14px">곡 목록</strong>
          <button class="btn small mobile-toggle" id="btn-list-toggle" type="button" aria-expanded="false">펼치기</button>
        </div>
        <div class="stat-row"><span>가사 입력 <b id="st-filled">0</b> / 72곡</span><span>평균 암기 <b id="st-avg">0%</b></span></div>
        <div class="meter" aria-hidden="true"><i id="st-bar"></i></div>
        <input id="search" type="search" placeholder="곡명·강·테마 검색" autocomplete="off">
      </div>
      <nav class="list" id="list" aria-label="곡 목록"></nav>
    </aside>

    <main class="sheet" id="sheet"></main>
  </div>
</div>

<audio id="player" preload="metadata"></audio>
<div class="playerbar" id="playerbar" hidden>
  <div class="pb-in">
    <button class="btn primary" id="pb-play" type="button">재생</button>
    <button class="btn small" id="pb-back" type="button" aria-label="5초 뒤로">−5초</button>
    <button class="btn small" id="pb-fwd" type="button" aria-label="5초 앞으로">+5초</button>
    <span class="pb-title" id="pb-title"></span>
    <span class="pb-time" id="pb-time">0:00 / 0:00</span>
    <input type="range" id="pb-seek" min="0" max="1000" value="0" step="1" aria-label="재생 위치">
  </div>
  <div class="pb-in" id="pb-tools">
    <span class="seg" aria-label="재생 속도"><button type="button" data-prate="0.75">0.75×</button><button type="button" data-prate="0.9">0.9×</button><button type="button" data-prate="1">1.0×</button></span>
    <button class="btn small" id="pb-ab" type="button">구간 반복</button>
    <button class="btn small" id="pb-line" type="button" hidden>한 줄 반복</button>
    <button class="btn small" id="pb-sync" type="button">줄 시간 맞추기</button>
    <span class="pb-time" id="pb-hint"></span>
    <span style="flex:1"></span>
    <label class="btn small ghost" for="audio-one">음악 바꾸기</label>
    <button class="btn small ghost danger" id="pb-remove" type="button">음악 빼기</button>
  </div>
  <div class="pb-in" id="pb-sync-row" hidden>
    <button class="btn primary" id="pb-stamp" type="button">1번째 줄 시작</button>
    <span class="pb-time" id="pb-sync-info">노래를 들으며 각 줄이 시작될 때 버튼(또는 스페이스바)을 누르세요</span>
    <span style="flex:1"></span>
    <button class="btn small" id="pb-sync-undo" type="button">한 줄 되돌리기</button>
    <button class="btn small primary" id="pb-sync-done" type="button">저장하고 끝내기</button>
    <button class="btn small ghost" id="pb-sync-cancel" type="button">취소</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cfb@1.2.2/dist/cfb.min.js"></script>

/* ---------- HWP reader (runs locally in this browser) ---------- */
/* HWP (v5, OLE) -> text -> {lines:[{en,ko,shared,note}]}  — shared between page and node test */
function hwpText(u8, CFB, pako){
  const cfb = CFB.read(u8, {type:'array'});
  const find = p => CFB.find(cfb, p);
  const hdr = find('/FileHeader') || find('FileHeader');
  if (!hdr) throw new Error('HWP 파일이 아닙니다');
  const compressed = (hdr.content[36] & 1) === 1;
  const secs = [];
  for (let i = 0; i < 400; i++) { const e = find('/BodyText/Section' + i) || find('BodyText/Section' + i); if (!e) break; secs.push(e); }
  let out = '';
  for (const sec of secs) {
    let d = Uint8Array.from(sec.content);
    if (compressed) d = pako.inflateRaw(d);
    const dv = new DataView(d.buffer, d.byteOffset, d.byteLength);
    let i = 0;
    while (i + 4 <= d.length) {
      const h = dv.getUint32(i, true); i += 4;
      const tag = h & 0x3ff; let size = (h >>> 20) & 0xfff;
      if (size === 0xfff) { size = dv.getUint32(i, true); i += 4; }
      if (tag === 67) {
        let j = i, t = '';
        while (j + 2 <= i + size) {
          const c = dv.getUint16(j, true);
          if ((c >= 1 && c <= 12) || (c >= 14 && c <= 23)) { j += 16; continue; }
          if (c === 13) t += '\n'; else if (c >= 32) t += String.fromCharCode(c);
          j += 2;
        }
        out += t;
      }
      i += size;
    }
  }
  return out;
}

function parseLesson(text, title){
  const HG = /[ㄱ-ㆎ가-힣]/g, LT = /[A-Za-z]/g;
  const cnt = (s, re) => (s.match(re) || []).length;
  const isKo = s => cnt(s, HG) >= 1;
  const isEn = s => cnt(s, LT) >= 2 && cnt(s, HG) < 2;
  const key = s => s.toLowerCase().replace(/[^a-z]/g, '');
  const tkey = key(title || '');
  let raw = text.split(/\r?\n/).map(l => l.replace(/[ 　]/g, ' ').trim());
  // table-style header: drop everything through the 방영일 date cell
  const dateIdx = raw.slice(0, 20).findIndex(l => /^\d{1,2}\s*월\s*\d{1,2}\s*일$/.test(l));
  if (dateIdx >= 0 && raw.slice(0, dateIdx).some(l => /회\s*차/.test(l))) raw = raw.slice(dateIdx + 1);
  const markEn = m => raw.filter(l => l.startsWith(m) && isEn(l.slice(1))).length;
  const starAll = raw.filter(l => l.startsWith('*')).length;
  const marker = markEn('▶') >= 3 ? '▶' : (markEn('*') >= 5 && markEn('*') >= starAll * 0.6 ? '*' : null);
  const arrowMode = !!marker;

  const blocks = []; let cur = null, mode = 'none', started = false, hdrSeen = 0;
  const newBlock = () => { cur = {en:[], ko:[], notes:[]}; blocks.push(cur); };
  for (let l of raw) {
    if (!l) continue;
    if (!started) {
      hdrSeen++;
      if (/^brain\s*pops/i.test(l) || /\d+\s*주\s*-/.test(l) || /^#\s*\d+/.test(l)) continue;
      if (hdrSeen <= 6 && tkey && /\s[-–—]\s|^\S+\s*$/.test(l) && key(l).startsWith(tkey.slice(0, Math.min(tkey.length, 12))) && !l.startsWith('▶')) continue;
    }
    if (/^[<\[(（【〈《].{0,20}[>\])）】〉》]$/.test(l)) { mode = 'none'; continue; }   // <A파트>, <후렴>, [Chorus]
    l = l.replace(/^[<\[〈《][^>\]〉》]{0,12}[>\]〉》]\s*/, '');
    if (!l) continue;
    const arrow = !!marker && l.startsWith(marker);
    if (arrow) l = l.slice(1).trim();
    if (!arrow && cur && cur.en.length && /^\*/.test(l)) {   // '*번역' 형식 (예: 3·4강)
      const b = l.slice(1).trim();
      if (cnt(b, HG) >= 4 && cnt(b, LT) === 0 && !/:/.test(b) && (!cur.ko.length || mode === 'ko')) { cur.ko.push(b); mode = 'ko'; continue; }
    }
    if (!arrow && (/^[*※☞\-–]/.test(l) || /^ex\)/i.test(l) || /:\s*\S*[\u3131-\uD7A3]/.test(l))) { if (!cur) newBlock(); cur.notes.push(l.replace(/^[*※]\s*/, '')); mode = 'note'; continue; }
    if (arrowMode) {
      if (arrow) { started = true; if (!cur || cur.ko.length || cur.notes.length) newBlock(); cur.en.push(l); mode = 'en'; continue; }
      if (!started) continue;
      if (isEn(l) && mode !== 'note') { started = true; if (mode !== 'en') newBlock(); cur.en.push(l); mode = 'en'; continue; }
      if (mode === 'note') { cur.notes.push(l); continue; }
      if (isKo(l) || mode === 'ko') { cur.ko.push(l); mode = 'ko'; continue; }
      cur.notes.push(l); continue;
    }
    if (isEn(l)) {
      started = true;
      if (!cur || cur.ko.length || cur.notes.length) newBlock();
      cur.en.push(l); mode = 'en'; continue;
    }
    if (!started) continue;
    if (mode === 'note') { cur.notes.push(l); continue; }
    if (isKo(l)) { cur.ko.push(l); mode = 'ko'; continue; }
  }
  const lines = [];
  for (const b of blocks) {
    if (!b.en.length) { if (lines.length && b.notes.length) lines[lines.length-1].note = [lines[lines.length-1].note, ...b.notes].filter(Boolean).join('\n'); continue; }
    const note = b.notes.join('\n');
    if (b.ko.length === b.en.length) b.en.forEach((en, i) => lines.push({en, ko:b.ko[i], shared:false, note: i === b.en.length-1 ? note : ''}));
    else { const ko = b.ko.join(' '); b.en.forEach((en, i) => lines.push({en, ko, shared: b.en.length > 1, note: i === b.en.length-1 ? note : ''})); }
  }
  return lines;
}

const HANGUL = /[ㄱ-ㆎ가-힣]/g, LATIN = /[A-Za-z]/g;
const count = (s, re) => (s.match(re) || []).length;
const isKo = s => count(s, HANGUL) > 0 && count(s, HANGUL) >= count(s, LATIN);
function parse(text){
  const out = [];
  for (const raw of text.split(/\r?\n/)) {
    const l = raw.replace(/ /g,' ').trim();
    if (!l) continue;
    if (/^[\[(（【].*[\])）】]$/.test(l) && count(l, HANGUL) === 0 && l.split(/\s+/).length <= 4) continue; // [Chorus] 같은 구간 표시
    const parts = l.split(/\s*(?:\t|\s\|\s|\s\/\/\s)\s*/);
    if (parts.length >= 2 && !isKo(parts[0]) && isKo(parts.slice(1).join(' '))) { out.push({en:parts[0], ko:parts.slice(1).join(' ')}); continue; }
    if (isKo(l)) { if (out.length) { const last = out[out.length-1]; last.ko = last.ko ? last.ko + ' ' + l : l; } continue; }
    out.push({en:l, ko:''});
  }
  return out;
}
const koShown = (lines, i) => lines[i].ko && (!lines[i].shared || !lines[i+1] || lines[i+1].ko !== lines[i].ko);
const unparse = lines => lines.map(l => l.ko ? l.en + '\n' + l.ko : l.en).join('\n');
const norm = w => w.toLowerCase().replace(/[’‘`´]/g,"'").replace(/[^a-z0-9']/g,'').replace(/^'+|'+$/g,'');
function tokens(line){

    const m = w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9](?:.*[A-Za-z0-9])?)?([^A-Za-z0-9]*)$/);
    return m && m[2] ? {pre:m[1], core:m[2], post:m[3]} : {pre:w, core:'', post:''};

}

      const shown = open ? esc(l.en) : tokens(l.en).map(t => t.core ? esc(t.pre) + esc(t.core[0]) + `<span class="gap">${'_'.repeat(Math.max(0,t.core.length-1))}</span>` + esc(t.post) : esc(t.pre)).join(' ');
      return `<div class="ln${open?' open':''}" data-i="${i}"><span class="n">${i+1}</span><div><div class="en" data-toggle="${i}" tabindex="0" role="button" aria-expanded="${open}">${shown}</div>${S.showKo && koShown(lines,i) ? `<div class="ko">${esc(l.ko)}</div>` : ''}</div><button class="speak" type="button" data-say="${i}" aria-label="${i+1}번째 줄 듣기">${SPK}</button></div>`;
    }).join('')}</div>`;
  }
  else if (S.mode === 'cloze') {
    const levels = [[1,'25%'],[2,'50%'],[3,'75%'],[4,'전부']];
    tool = `<span>가리는 양</span><span class="seg">${levels.map(([v,l]) => `<button type="button" data-level="${v}" aria-pressed="${S.level===v}">${l}</button>`).join('')}</span>${koToggle}<span class="sep"></span><button class="btn small" type="button" id="btn-shuffle">새로 섞기</button><button class="btn small" type="button" id="btn-show">정답 보기</button><button class="btn small primary" type="button" id="btn-check">채점</button>`;
    const r = rng(clozeSeed * 9973 + s.id.length * 31 + S.level);
    let bi = 0;
    body = `<p class="parse-info" style="margin:0 0 10px">빈칸에 단어를 쓰고 Enter로 다음 칸으로 갑니다. 대소문자·문장부호는 따지지 않습니다. <span class="score" id="cloze-score"></span></p><div class="lines cloze">${lines.map((l,i) => {
      const tk = tokens(l.en);
      const idx = tk.map((t,j) => t.core ? j : -1).filter(j => j >= 0);
      const k = S.level === 4 ? idx.length : Math.max(1, Math.round(idx.length * S.level / 4));
      const pick = new Set(idx.map(j => [j, r()]).sort((a,b) => a[1]-b[1]).slice(0,k).map(x => x[0]));
      const html = tk.map((t,j) => pick.has(j)
        ? `${esc(t.pre)}<input class="blank" id="b${bi++}" data-ans="${esc(t.core)}" size="${Math.max(2,t.core.length)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${i+1}번째 줄 빈칸">${esc(t.post)}`
        : esc(t.pre + t.core + t.post)).join(' ');
      return `<div class="ln" data-i="${i}"><span class="n">${i+1}</span><div><div class="en">${html}</div>${S.showKo && koShown(lines,i) ? `<div class="ko">${esc(l.ko)}</div>` : ''}</div><button class="speak" type="button" data-say="${i}" aria-label="${i+1}번째 줄 듣기">${SPK}</button></div>`;
    }).join('')}</div>`;
  }
  else if (S.mode === 'test') {
    tool = `<span>순서</span><span class="seg"><button type="button" data-order="seq" aria-pressed="${!T || T.order==='seq'}">순서대로</button><button type="button" data-order="shuffle" aria-pressed="${!!T && T.order==='shuffle'}">섞어서</button></span><span class="seg"><button type="button" data-only="all" aria-pressed="${!T || !T.onlyWeak}">전체 줄</button><button type="button" data-only="weak" aria-pressed="${!!T && T.onlyWeak}">못 외운 줄만</button></span><span class="sep"></span>${rateSeg}`;
    body = testHTML(s);
  }
  sheet.innerHTML = head + `<div class="toolbar">${tool}</div><div class="body">${body}</div>`;
  bindSheet(s);
}

    <div class="hint"><b>직접 붙여넣기</b>

      <li>아래 칸에 붙여넣습니다. 영어 줄 바로 다음에 한글 해석 줄이 있으면 자동으로 짝지어집니다.</li>

    <div class="row"><span class="parse-info" id="ed-info"></span></div>

      <label class="btn" for="ed-file">.txt 파일 불러오기</label><input type="file" id="ed-file" accept=".txt,text/plain" hidden>
      ${cur.length ? '<button class="btn ghost" type="button" id="ed-cancel">취소</button><span class="sep" style="flex:1"></span><button class="btn ghost danger" type="button" id="ed-del">이 곡 가사 지우기</button>' : ''}

function bindEditor(s){
  const ta = document.getElementById('ed-text'), info = document.getElementById('ed-info');
  const upd = () => { const p = parse(ta.value); const ko = p.filter(l => l.ko).length; info.textContent = p.length ? `영어 ${p.length}줄 인식 · 해석이 붙은 줄 ${ko}` : '붙여넣으면 인식된 줄 수가 여기에 나옵니다'; };
  ta.addEventListener('input', upd); upd();
  document.getElementById('ed-save').onclick = () => {
    const p = parse(ta.value);
    if (!p.length) { info.textContent = '영어 가사 줄을 찾지 못했습니다. 가사를 붙여넣었는지 확인해 주세요.'; return; }
    const old = linesOf(s); S.lyrics[s.id] = p;
    if (old.length !== p.length || old.some((l,i) => l.en !== p[i].en)) { S.progress[s.id] = new Array(p.length).fill(0); delete S.sync[s.id]; }
    editing = false; T = null; if (S.mode === 'test') S.mode = 'read'; save(); renderList(); renderSheet(); toast('저장했습니다');
  };
  document.getElementById('ed-file').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { ta.value = r.result; upd(); }; r.readAsText(f, 'utf-8'); };
  const c = document.getElementById('ed-cancel'); if (c) c.onclick = () => { editing = false; renderSheet(); };
  const d = document.getElementById('ed-del');
  if (d) d.onclick = () => {
    if (d.dataset.armed) { delete S.lyrics[s.id]; delete S.progress[s.id]; editing = false; save(); renderList(); renderSheet(); toast('가사를 지웠습니다'); }
    else { d.dataset.armed = '1'; d.textContent = '한 번 더 누르면 지워집니다'; setTimeout(() => { if (d.isConnected) { delete d.dataset.armed; d.textContent = '이 곡 가사 지우기'; } }, 3000); }
  };
}

/* ---------- test mode ---------- */
function startTest(s, order, onlyWeak){
  const p = prog(s);
  let q = linesOf(s).map((_,i) => i);
  if (onlyWeak) q = q.filter(i => p[i] !== 2);
  if (order === 'shuffle') { const r = rng(Date.now() % 100000); q = q.map(i => [i, r()]).sort((a,b) => a[1]-b[1]).map(x => x[0]); }
  T = {sid:s.id, order, onlyWeak, queue:q, total:q.length, known:0, again:0, revealed:false, typed:''};
}
function testHTML(s){
  if (!T || T.sid !== s.id) startTest(s, T ? T.order : 'seq', T ? T.onlyWeak : false);
  const lines = linesOf(s);
  if (!T.total) return `<div class="done-box"><div class="big">100%</div><p>못 외운 줄이 없습니다. 전체 줄로 다시 점검해 보세요.</p></div>`;
  if (!T.queue.length) {
    return `<div class="done-box"><div class="big">${pct(s)}%</div><p>이번 회차 끝. 한 번에 외운 줄 ${T.known} · 다시 본 횟수 ${T.again}</p><div class="row" style="justify-content:center"><button class="btn primary" type="button" id="t-restart">처음부터 다시</button><button class="btn" type="button" id="t-weak">못 외운 줄만</button></div></div>`;
  }
  const i = T.queue[0], l = lines[i], prev = i > 0 ? lines[i-1] : null;
  const done = T.total - T.queue.length;
  let reveal = '';
  if (T.revealed) {
    const exp = tokens(l.en), got = T.typed.split(/\s+/).map(norm).filter(Boolean);
    let marked, acc = '';
    if (got.length) {
      const e = exp.map(t => norm(t.core)), m = e.length, n = got.length;
      const dp = Array.from({length:m+1}, () => new Array(n+1).fill(0));
      for (let a = m-1; a >= 0; a--) for (let b = n-1; b >= 0; b--) dp[a][b] = e[a] && e[a] === got[b] ? dp[a+1][b+1] + 1 : Math.max(dp[a+1][b], dp[a][b+1]);
      const hit = new Set(); let a = 0, b = 0;
      while (a < m && b < n) { if (e[a] && e[a] === got[b]) { hit.add(a); a++; b++; } else if (dp[a+1][b] >= dp[a][b+1]) a++; else b++; }
      const words = exp.filter(t => t.core).length;
      marked = exp.map((t,j) => !t.core ? esc(t.pre) : `${esc(t.pre)}<span class="${hit.has(j)?'w-ok':'w-miss'}">${esc(t.core)}</span>${esc(t.post)}`).join(' ');
      acc = `<span class="acc">단어 ${hit.size} / ${words} 일치 (${Math.round(hit.size/words*100)}%)</span>`;
    } else marked = esc(l.en);
    reveal = `<div class="reveal">${marked}${acc}</div>`;
  }
  return `<div class="card">
    <div class="progress-line"><span>${i+1}번째 줄</span><span>${done} / ${T.total}</span></div>
    <div class="meter"><i style="width:${done/T.total*100}%"></i></div>
    <div class="cue"><small>앞 줄</small>${prev ? esc(prev.en) : '첫 줄입니다'}</div>
    <div class="prompt-ko${l.ko?'':' none'}">${l.ko ? esc(l.ko) : '해석이 없는 줄입니다. 앞 줄에 이어지는 가사를 떠올려 보세요.'}</div>
    <textarea id="t-answer" placeholder="떠오르는 영어 가사를 쓰거나, 소리 내어 말한 뒤 정답 보기를 누르세요" autocomplete="off" autocapitalize="off" spellcheck="false" ${T.revealed?'readonly':''}>${esc(T.typed)}</textarea>
    ${T.revealed ? reveal + `<div class="grade"><button class="btn again" type="button" id="t-again">다시 (뒤로 보내기)</button><button class="btn know" type="button" id="t-know">외웠음</button></div><div class="row"><button class="btn small" type="button" id="t-say">${SPK} 듣기</button></div>`
      : `<div class="row"><button class="btn primary" type="button" id="t-reveal">정답 보기</button><button class="btn" type="button" id="t-hint">첫 글자 힌트</button><button class="btn" type="button" id="t-say">${SPK} 듣기</button></div><div class="parse-info" id="t-hint-box"></div>`}
  </div>`;
}

/* ---------- events on the sheet ---------- */
function bindSheet(s){
  const lines = linesOf(s);
  const q = sel => sheet.querySelector(sel);
  const eb = q('#btn-edit'); if (eb) eb.onclick = () => { stopSpeak(); editing = true; renderSheet(); };
  const rb = q('#btn-reset');
  if (rb) rb.onclick = () => {
    if (rb.dataset.armed) { S.progress[s.id] = new Array(lines.length).fill(0); T = null; save(); renderList(); renderSheet(); toast('암기 기록을 초기화했습니다'); }
    else { rb.dataset.armed = '1'; rb.textContent = '한 번 더 누르면 초기화'; setTimeout(() => { if (rb.isConnected) { delete rb.dataset.armed; rb.textContent = '암기 기록 초기화'; } }, 3000); }
  };
  sheet.querySelectorAll('.tab').forEach(t => t.onclick = () => { stopSpeak(); S.mode = t.dataset.mode; save(); renderSheet(); });
  const ko = q('#opt-ko'); if (ko) ko.onchange = () => { S.showKo = ko.checked; save(); keepInputs(renderSheet); };
  sheet.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => { S.rate = +b.dataset.rate; save(); sheet.querySelectorAll('[data-rate]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  sheet.querySelectorAll('[data-say]').forEach(b => b.onclick = () => sayLine(s, +b.dataset.say));
  decorateSync(s);

  if (S.mode === 'read') {
    const nt = q('#opt-note'); if (nt) nt.onchange = () => { S.showNote = nt.checked; save(); renderSheet(); };
    const he = q('#opt-hide-en'); he.onchange = () => { hideEn = he.checked; revealedEn.clear(); renderSheet(); };
    sheet.querySelectorAll('.hidden-en').forEach(el => { const f = () => { revealedEn.add(+el.dataset.reveal); el.classList.remove('hidden-en'); }; el.onclick = f; el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); f(); } }; });
    q('#btn-playall').onclick = () => {
      if (AUD.has.has(s.id) && AUD.id === s.id) { stopSpeak(); P.currentTime = 0; segEnd = null; P.play().catch(() => {}); return; }
      if (playAll) { stopSpeak(); q('#btn-playall').textContent = '전곡 읽어 주기'; return; }
      stopSpeak(); playAll = true; q('#btn-playall').textContent = '멈춤';
      const rows = sheet.querySelectorAll('.ln');
      const step = i => {
        rows.forEach(r => r.classList.remove('playing'));
        if (!playAll || i >= lines.length) { playAll = false; const b = q('#btn-playall'); if (b) b.textContent = '전곡 읽어 주기'; return; }
        rows[i].classList.add('playing'); rows[i].scrollIntoView({block:'nearest', behavior:'smooth'});
        speak(lines[i].en, () => setTimeout(() => step(i+1), 350));
      };
      step(0);
    };
  }
  if (S.mode === 'initials') {
    sheet.querySelectorAll('[data-toggle]').forEach(el => { const f = () => { const i = +el.dataset.toggle; initialsOpen.has(i) ? initialsOpen.delete(i) : initialsOpen.add(i); renderSheet(); }; el.onclick = f; el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); f(); } }; });
    q('#btn-open-all').onclick = () => { if (initialsOpen.size === lines.length) initialsOpen.clear(); else lines.forEach((_,i) => initialsOpen.add(i)); renderSheet(); };
  }
  if (S.mode === 'cloze') {
    const blanks = [...sheet.querySelectorAll('.blank')];
    sheet.querySelectorAll('[data-level]').forEach(b => b.onclick = () => { S.level = +b.dataset.level; save(); renderSheet(); });
    q('#btn-shuffle').onclick = () => { clozeSeed++; renderSheet(); };
    const check = () => {
      let ok = 0, filled = 0;
      blanks.forEach(b => { b.classList.remove('ok','bad'); if (!b.value.trim()) return; filled++; if (norm(b.value) === norm(b.dataset.ans)) { b.classList.add('ok'); ok++; } else b.classList.add('bad'); });
      q('#cloze-score').textContent = `· 맞음 ${ok} / ${blanks.length}` + (filled < blanks.length ? ` (빈칸 ${blanks.length - filled}개 남음)` : '');
      if (ok === blanks.length && blanks.length) toast('빈칸을 모두 맞혔습니다');
    };
    q('#btn-check').onclick = check;
    q('#btn-show').onclick = () => { blanks.forEach(b => { if (norm(b.value) !== norm(b.dataset.ans)) { b.value = b.dataset.ans; b.classList.remove('ok'); b.classList.add('bad'); } }); q('#cloze-score').textContent = '· 틀린 칸에 정답을 채웠습니다'; };
    blanks.forEach((b,k) => {
      b.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (blanks[k+1]) blanks[k+1].focus(); else check(); } });
      b.addEventListener('input', () => b.classList.remove('ok','bad'));
    });
    if (blanks[0] && window.matchMedia('(min-width: 861px)').matches) blanks[0].focus({preventScroll:true});
  }
  if (S.mode === 'test') {
    sheet.querySelectorAll('[data-order]').forEach(b => b.onclick = () => { startTest(s, b.dataset.order, T ? T.onlyWeak : false); renderSheet(); });
    sheet.querySelectorAll('[data-only]').forEach(b => b.onclick = () => { startTest(s, T ? T.order : 'seq', b.dataset.only === 'weak'); renderSheet(); });
    const r1 = q('#t-restart'); if (r1) r1.onclick = () => { startTest(s, T.order, false); renderSheet(); };
    const r2 = q('#t-weak'); if (r2) r2.onclick = () => { startTest(s, T.order, true); renderSheet(); };
    if (!T.queue.length) return;
    const i = T.queue[0], ans = q('#t-answer');
    if (ans && !T.revealed) { ans.oninput = () => { T.typed = ans.value; }; ans.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); T.typed = ans.value; T.revealed = true; renderSheet(); } }; if (window.matchMedia('(min-width: 861px)').matches) ans.focus({preventScroll:true}); }
    const say = q('#t-say'); if (say) say.onclick = () => sayLine(s, i);
    const rv = q('#t-reveal'); if (rv) rv.onclick = () => { T.typed = ans.value; T.revealed = true; renderSheet(); };
    const hn = q('#t-hint'); if (hn) hn.onclick = () => { q('#t-hint-box').textContent = tokens(lines[i].en).map(t => t.core ? t.pre + t.core[0] + '_'.repeat(Math.max(0,t.core.length-1)) + t.post : t.pre).join(' '); };
    const p = prog(s);
    const kn = q('#t-know'); if (kn) kn.onclick = () => { if (p[i] !== 1) T.known++; p[i] = 2; T.queue.shift(); T.revealed = false; T.typed = ''; save(); renderList(); renderSheet(); };
    const ag = q('#t-again'); if (ag) ag.onclick = () => { p[i] = 1; T.again++; T.queue.push(T.queue.shift()); T.revealed = false; T.typed = ''; save(); renderList(); renderSheet(); };
    if (T.revealed) document.onkeydown = e => { if (S.mode !== 'test' || !T || !T.revealed) { document.onkeydown = null; return; } if (e.key === '1') q('#t-again')?.click(); if (e.key === '2' || e.key === 'Enter') q('#t-know')?.click(); };
    else document.onkeydown = null;
  }
}
/* keep typed cloze answers when re-rendering for the 해석 toggle */
function keepInputs(fn){
  const vals = [...sheet.querySelectorAll('.blank')].map(b => [b.id, b.value, b.className]);
  fn();
  vals.forEach(([id,v,c]) => { const b = document.getElementById(id); if (b) { b.value = v; b.className = c; } });
}

/* ---------- lesson import (zip / hwp) ---------- */
function songForFile(name, text){
  const base = name.split('/').pop();
  const m = base.match(/^\s*(\d+)\s*강/) || text.slice(0, 300).match(/#\s*(\d+)/);
  if (m) { const s = byId('L' + (+m[1])); if (s) return s; }
  const k = x => x.toLowerCase().replace(/[^a-z]/g, '');
  const kb = k(base.replace(/\.hwp$/i, ''));
  return SONGS.slice().sort((a,b) => k(b.title).length - k(a.title).length).find(s => kb.endsWith(k(s.title))) || null;
}
async function importFiles(files){
  if (!window.CFB || !window.pako || !window.JSZip) { toast('파일 읽기 도구를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.'); return; }
  const jobs = [];
  for (const f of files) {
    if (/\.zip$/i.test(f.name)) {
      const z = await JSZip.loadAsync(f);
      Object.values(z.files).forEach(e => { if (!e.dir && /\.hwp$/i.test(e.name) && !/(^|\/)(__MACOSX|\._)/.test(e.name)) jobs.push({name:e.name, get:() => e.async('uint8array')}); });
    } else if (/\.hwp$/i.test(f.name)) jobs.push({name:f.name, get:async () => new Uint8Array(await f.arrayBuffer())});
  }
  let ok = 0; const fail = [];
  for (const j of jobs) {
    try {
      const text = hwpText(await j.get(), CFB, pako);
      const s = songForFile(j.name, text);
      if (!s) { fail.push(j.name.split('/').pop()); continue; }
      const lines = parseLesson(text, s.title);
      if (!lines.length) { fail.push(j.name.split('/').pop()); continue; }
      const old = S.lyrics[s.id] || [];
      S.lyrics[s.id] = lines;
      if (old.length !== lines.length || old.some((l,i) => l.en !== lines[i].en)) { S.progress[s.id] = new Array(lines.length).fill(0); delete S.sync[s.id]; }
      ok++;
    } catch(e) { fail.push(j.name.split('/').pop()); }
  }
  save();
  if (ok && (S.current === 'ex' || !linesOf(byId(S.current)).length)) { const first = SONGS.find(s => linesOf(s).length); if (first) S.current = first.id; }
  editing = false; T = null; renderList(); renderSheet(); loadAudio();
  toast(jobs.length ? `${ok}곡을 불러왔습니다` + (fail.length ? ` · ${fail.length}개는 읽지 못했습니다` : '') : 'hwp 파일을 찾지 못했습니다');
  if (fail.length) console.log('읽지 못한 파일:', fail);
}
document.getElementById('hwp-files').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; if (fs.length) { toast('자료를 읽는 중입니다…'); importFiles(fs).catch(() => toast('파일을 읽지 못했습니다. zip 또는 hwp 파일인지 확인해 주세요.')); } });

/* ---------- music (stored in this browser's IndexedDB) ---------- */
const P = document.getElementById('player');
const AUD = {has:new Set(), id:null, url:null, mem:{}};
let dbP = null;
function db(){ return dbP || (dbP = new Promise((res, rej) => { try { const r = indexedDB.open('popsong-audio', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch(e) { rej(e); } })); }
async function idb(op, key, val){
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction('files', op === 'get' || op === 'keys' ? 'readonly' : 'readwrite'), st = t.objectStore('files');
    const r = op === 'get' ? st.get(key) : op === 'keys' ? st.getAllKeys() : op === 'put' ? st.put(val, key) : st.delete(key);
    t.oncomplete = () => res(r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
async function storeAudio(id, file){
  try { await idb('put', id, {blob:file, name:file.name}); }
  catch(e) { AUD.mem[id] = {blob:file, name:file.name}; AUD.memOnly = true; }
  AUD.has.add(id);
}
async function getAudio(id){ if (AUD.mem[id]) return AUD.mem[id]; try { return await idb('get', id); } catch(e) { return null; } }
const hasAudio = s => AUD.has.has(s.id);
const fmt = t => { if (!isFinite(t)) t = 0; const m = Math.floor(t / 60), x = Math.floor(t % 60); return m + ':' + String(x).padStart(2, '0'); };
let segEnd = null, ab = {a:null, b:null}, lineLoop = false, syncing = null;
const pb = id => document.getElementById(id);

async function loadAudio(){
  const s = byId(S.current);
  const want = s && hasAudio(s) ? s.id : null;
  if (AUD.id === want) { refreshBar(); return; }
  P.pause(); segEnd = null; ab = {a:null, b:null}; lineLoop = false; endSync(false);
  if (AUD.url) { URL.revokeObjectURL(AUD.url); AUD.url = null; }
  AUD.id = want;
  if (want) { const rec = await getAudio(want); if (rec && rec.blob && AUD.id === want) { AUD.url = URL.createObjectURL(rec.blob); P.src = AUD.url; P.playbackRate = S.prate || 1; } else if (AUD.id === want) { AUD.has.delete(want); AUD.id = null; } }
  else { P.removeAttribute('src'); P.load(); }
  refreshBar();
  const cs = byId(S.current); if (cs && !editing) decorateSync(cs);
}
function refreshBar(){
  const s = byId(S.current), on = !!(s && AUD.id === s.id && AUD.url);
  pb('playerbar').hidden = !on; document.body.classList.toggle('has-player', on);
  if (!on) return;
  const synced = !!(S.sync[s.id] && S.sync[s.id].length);
  pb('pb-title').textContent = (s.example ? '' : s.no + '강 ') + s.title;
  pb('pb-play').textContent = P.paused ? '재생' : '일시정지';
  pb('pb-line').hidden = !synced;
  pb('pb-line').classList.toggle('on', lineLoop);
  pb('pb-ab').classList.toggle('on', ab.a != null);
  pb('pb-ab').textContent = ab.a == null ? '구간 반복' : ab.b == null ? `A ${fmt(ab.a)} → B 지점에서 누르기` : `반복 ${fmt(ab.a)}–${fmt(ab.b)} (끄기)`;
  pb('pb-sync').textContent = synced ? '줄 시간 다시 맞추기' : '줄 시간 맞추기';
  pb('pb-hint').textContent = synced ? '줄 번호를 누르면 그 줄로 이동' : (linesOf(s).length ? '' : '');
  document.querySelectorAll('[data-prate]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.prate === (S.prate || 1)));
  pb('pb-tools').hidden = !!syncing; pb('pb-sync-row').hidden = !syncing;
}
function lineAt(id, t){ const a = S.sync[id]; if (!a) return -1; let k = -1; for (let i = 0; i < a.length; i++) if (a[i] != null && a[i] <= t + 0.05) k = i; return k; }
function segOf(id, i){ const a = S.sync[id]; if (!a || a[i] == null) return null; let e = null; for (let j = i + 1; j < a.length; j++) if (a[j] != null) { e = a[j]; break; } return [a[i], e == null ? (P.duration || a[i] + 6) : e]; }
function sayLine(s, i){
  stopSpeak();
  const seg = AUD.id === s.id && AUD.url ? segOf(s.id, i) : null;
  if (seg) { P.currentTime = seg[0]; segEnd = seg[1]; P.play().catch(() => {}); }
  else speak(linesOf(s)[i].en);
}
function decorateSync(s){
  const synced = AUD.id === s.id && S.sync[s.id];
  sheet.querySelectorAll('.ln[data-i] .n').forEach(n => {
    const i = +n.parentElement.dataset.i;
    if (synced && S.sync[s.id][i] != null) { n.classList.add('jump'); n.title = '이 줄부터 재생'; n.onclick = () => { stopSpeak(); segEnd = null; P.currentTime = S.sync[s.id][i]; P.play().catch(() => {}); }; }
  });
  highlight(true);
}
let lastHi = -2;
function highlight(force){
  const s = byId(S.current); if (!s || AUD.id !== s.id) return;
  const i = syncing ? syncing.i - 1 : lineAt(s.id, P.currentTime);
  if (i === lastHi && !force) return; lastHi = i;
  if (playAll) return;
  sheet.querySelectorAll('.ln.playing').forEach(e => e.classList.remove('playing'));
  if (i < 0 || (P.paused && !syncing)) return;
  const row = sheet.querySelector(`.ln[data-i="${i}"]`);
  if (row) { row.classList.add('playing'); if (!P.paused) row.scrollIntoView({block:'nearest', behavior:'smooth'}); }
}
P.addEventListener('timeupdate', () => {
  const t = P.currentTime, d = P.duration;
  pb('pb-time').textContent = fmt(t) + ' / ' + fmt(d);
  if (!seeking && isFinite(d) && d) pb('pb-seek').value = Math.round(t / d * 1000);
  const s = byId(S.current);
  if (segEnd != null && t >= segEnd) { P.pause(); segEnd = null; }
  if (ab.a != null && ab.b != null && t >= ab.b) P.currentTime = ab.a;
  if (lineLoop && s) { const k = lineAt(s.id, t - 0.25); const seg = k >= 0 ? segOf(s.id, k) : null; if (lineLoop.k == null && k >= 0) lineLoop = {k}; const L = lineLoop.k != null ? segOf(s.id, lineLoop.k) : seg; if (L && t >= L[1] - 0.05) P.currentTime = L[0]; }
  highlight(false);
});
['play','pause','loadedmetadata','ended'].forEach(ev => P.addEventListener(ev, () => { pb('pb-time').textContent = fmt(P.currentTime) + ' / ' + fmt(P.duration); refreshBar(); highlight(true); if (ev === 'ended' && syncing) endSync(true); }));
let seeking = false;
pb('pb-seek').addEventListener('input', () => { seeking = true; if (isFinite(P.duration)) pb('pb-time').textContent = fmt(pb('pb-seek').value / 1000 * P.duration) + ' / ' + fmt(P.duration); });
pb('pb-seek').addEventListener('change', () => { seeking = false; if (isFinite(P.duration)) { segEnd = null; P.currentTime = pb('pb-seek').value / 1000 * P.duration; } });
pb('pb-play').onclick = () => { stopSpeak(); segEnd = null; P.paused ? P.play().catch(() => toast('이 음악 파일을 재생하지 못했습니다')) : P.pause(); };
pb('pb-back').onclick = () => { P.currentTime = Math.max(0, P.currentTime - 5); };
pb('pb-fwd').onclick = () => { P.currentTime = Math.min(P.duration || 0, P.currentTime + 5); };
document.querySelectorAll('[data-prate]').forEach(b => b.onclick = () => { S.prate = +b.dataset.prate; P.playbackRate = S.prate; save(); refreshBar(); });
pb('pb-ab').onclick = () => {
  if (ab.a == null) { ab.a = P.currentTime; toast('A 지점을 찍었습니다. 반복을 끝낼 곳에서 한 번 더 누르세요'); }
  else if (ab.b == null) { if (P.currentTime > ab.a + 0.5) { ab.b = P.currentTime; P.currentTime = ab.a; P.play().catch(() => {}); } else toast('B 지점은 A 지점보다 뒤여야 합니다'); }
  else ab = {a:null, b:null};
  lineLoop = false; refreshBar();
};
pb('pb-line').onclick = () => {
  const s = byId(S.current);
  if (lineLoop) lineLoop = false;
  else { ab = {a:null, b:null}; const k = Math.max(0, lineAt(s.id, P.currentTime)); lineLoop = {k}; const seg = segOf(s.id, k); if (seg) { P.currentTime = seg[0]; P.play().catch(() => {}); } }
  refreshBar();
};
pb('pb-remove').onclick = async () => {
  const b = pb('pb-remove');
  if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = '한 번 더 누르면 뺍니다'; setTimeout(() => { delete b.dataset.armed; b.textContent = '음악 빼기'; }, 3000); return; }
  delete b.dataset.armed; b.textContent = '음악 빼기';
  const id = S.current; delete AUD.mem[id]; try { await idb('del', id); } catch(e) {}
  AUD.has.delete(id); await loadAudio(); renderList(); renderSheet(); toast('음악을 뺐습니다');
};
/* line timing */
function startSync(){
  const s = byId(S.current); if (!linesOf(s).length) { toast('먼저 가사를 넣어 주세요'); return; }
  syncing = {id:s.id, times:[], i:0}; ab = {a:null, b:null}; lineLoop = false; segEnd = null;
  if (S.mode !== 'read') { S.mode = 'read'; renderSheet(); }
  P.currentTime = 0; P.play().catch(() => {}); updSync(); refreshBar();
}
function updSync(){
  const s = byId(syncing.id), n = linesOf(s).length;
  pb('pb-stamp').textContent = syncing.i < n ? `${syncing.i + 1}번째 줄 시작` : '모든 줄을 찍었습니다';
  pb('pb-stamp').disabled = syncing.i >= n;
  const nx = linesOf(s)[syncing.i];
  pb('pb-sync-info').textContent = nx ? `다음: ${nx.en.slice(0, 48)}${nx.en.length > 48 ? '…' : ''}` : '저장하고 끝내기를 누르세요';
  highlight(true);
}
function stamp(){ if (!syncing) return; const n = linesOf(byId(syncing.id)).length; if (syncing.i >= n) return; syncing.times[syncing.i++] = Math.max(0, P.currentTime - 0.15); updSync(); }
function endSync(keep){
  if (!syncing) return;
  if (keep && syncing.times.length >= 2) { S.sync[syncing.id] = syncing.times.slice(); save(); toast(`${syncing.times.length}줄의 시작 시간을 저장했습니다`); }
  else if (keep) toast('두 줄 이상 찍어야 저장됩니다');
  syncing = null; refreshBar(); renderSheet();
}
pb('pb-sync').onclick = startSync;
pb('pb-stamp').onclick = stamp;
pb('pb-sync-undo').onclick = () => { if (syncing && syncing.i > 0) { syncing.i--; syncing.times.length = syncing.i; P.currentTime = Math.max(0, (syncing.times[syncing.i - 1] ?? 0)); updSync(); } };
pb('pb-sync-done').onclick = () => { P.pause(); endSync(true); };
pb('pb-sync-cancel').onclick = () => { P.pause(); endSync(false); };
document.addEventListener('keydown', e => {
  if (!syncing) return;
  if (e.target.closest && e.target.closest('input,textarea,select')) return;
  if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); stamp(); }
});
/* matching music files to songs */
function songForAudio(name){
  const base = name.split('/').pop().replace(/\.[^.]+$/, '');
  const words = x => ' ' + x.toLowerCase().replace(/[’'`]/g, '').replace(/[^a-z0-9]+/g, ' ').trim() + ' ';
  const wb = words(base);
  const hit = SONGS.slice().sort((a,b) => b.title.length - a.title.length).find(s => wb.includes(words(s.title)));
  if (hit) return hit;
  const m = base.match(/(\d+)\s*강/); if (m && byId('L' + (+m[1]))) return byId('L' + (+m[1]));
  return null;
}
pb && document.getElementById('audio-files').addEventListener('change', async e => {
  const fs = [...e.target.files]; e.target.value = ''; if (!fs.length) return;
  toast('음악을 저장하는 중입니다…');
  let ok = 0; const miss = [];
  for (const f of fs) { const s = songForAudio(f.name); if (!s) { miss.push(f.name); continue; } await storeAudio(s.id, f); ok++; }
  await loadAudio(); renderList(); renderSheet();
  toast(`${ok}곡에 음악을 넣었습니다` + (miss.length ? ` · ${miss.length}개는 곡을 찾지 못했습니다(곡을 고른 뒤 '음악 넣기'로 넣어 주세요)` : '') + (AUD.memOnly ? ' · 저장 공간이 부족해 이번 접속 동안만 유지됩니다' : ''));
});
document.getElementById('audio-one').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const s = byId(S.current); if (!s) return;
  await storeAudio(s.id, f); AUD.id = '__reload'; await loadAudio(); renderList(); renderSheet();
  toast('음악을 넣었습니다' + (AUD.memOnly ? ' · 저장 공간이 부족해 이번 접속 동안만 유지됩니다' : ''));
});

/* ---------- backup ---------- */
const bp = document.getElementById('backup-panel'), bt = document.getElementById('backup-text'), im = document.getElementById('import-msg');
document.getElementById('btn-backup').onclick = () => { bp.hidden = !bp.hidden; };
document.getElementById('btn-export').onclick = () => {
  bt.value = JSON.stringify({app:'popsong-memorizer', v:1, saved:new Date().toISOString(), lyrics:S.lyrics, progress:S.progress, sync:S.sync});
  document.getElementById('btn-copy-export').disabled = false;
  im.textContent = `${Object.keys(S.lyrics).length}곡 백업 코드를 만들었습니다`;
};
document.getElementById('btn-copy-export').onclick = () => {
  const done = () => toast('백업 코드를 복사했습니다');
  try { navigator.clipboard.writeText(bt.value).then(done, () => { bt.select(); im.textContent = '자동 복사가 막혀 있어 코드를 선택해 두었습니다. Ctrl+C로 복사하세요.'; }); }
  catch(e) { bt.select(); im.textContent = '코드를 선택해 두었습니다. Ctrl+C로 복사하세요.'; }
};
function importText(txt){
  try {
    const d = JSON.parse(txt);
    if (!d || typeof d.lyrics !== 'object') throw 0;
    let n = 0;
    for (const [id, lines] of Object.entries(d.lyrics)) {
      if (!byId(id) || !Array.isArray(lines)) continue;
      S.lyrics[id] = lines.filter(l => l && typeof l.en === 'string').map(l => ({en:String(l.en), ko:String(l.ko || ''), shared:!!l.shared, note:String(l.note || '')}));
      if (d.sync && Array.isArray(d.sync[id])) S.sync[id] = d.sync[id].map(Number);
      if (d.progress && Array.isArray(d.progress[id])) S.progress[id] = d.progress[id].map(v => (v === 1 || v === 2) ? v : 0);
      n++;
    }
    save(); renderList(); renderSheet(); im.textContent = `${n}곡을 복원했습니다`; toast('복원했습니다');
  } catch(e) { im.textContent = '백업 코드 형식이 아닙니다. 백업 코드 만들기로 만든 내용을 그대로 붙여넣어 주세요.'; }
}
document.getElementById('btn-import').onclick = () => { if (bt.value.trim()) importText(bt.value.trim()); else im.textContent = '먼저 백업 코드를 붙여넣어 주세요'; };
document.getElementById('import-file').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => importText(String(r.result)); r.readAsText(f, 'utf-8'); };

if (!byId(S.current)) S.current = 'ex';
if (!MODES.some(m => m[0] === S.mode)) S.mode = 'read';
renderList(); renderSheet();
idb('keys').then(keys => { (keys || []).forEach(k => AUD.has.add(k)); renderList(); renderSheet(); loadAudio(); }).catch(() => {});
})();
